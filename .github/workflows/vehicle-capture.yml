name: Scheduled 15-route vehicle evidence
on:
  # UTC schedules: six 5-minute observations per 30-minute KST window.
  # GitHub scheduling is best-effort; runs may start late or be skipped.
  schedule:
    - cron: '0,5,10,15,20,25 23 * * 0-4'  # weekday 08:00-08:25 KST
    - cron: '0,5,10,15,20,25 1 * * 1-5'   # weekday 10:00-10:25 KST
    - cron: '0,5,10,15,20,25 5 * * 1-5'   # weekday 14:00-14:25 KST
    - cron: '0,5,10,15,20,25 8 * * 1-5'   # weekday 17:00-17:25 KST
    - cron: '0,5,10,15,20,25 1 * * 0,6'   # weekend 10:00-10:25 KST
    - cron: '0,5,10,15,20,25 7 * * 0,6'   # weekend 16:00-16:25 KST
  workflow_dispatch:
    inputs:
      scope:
        description: "Whole route (default) or optional direction-specific stop windows"
        type: choice
        required: true
        default: full
        options:
          - full
          - section

permissions:
  contents: read

concurrency:
  group: bus-position-snapshots-main
  cancel-in-progress: false

jobs:
  capture:
    name: Optional bus snapshot (credentials required)
    outputs:
      ready: ${{ steps.credentials.outputs.ready }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check API credential availability without failing
        id: credentials
        env:
          SEOUL_BUS_API_KEY: ${{ secrets.SEOUL_BUS_API_KEY }}
        run: |
          python - <<'PY'
          import os
          ready=bool(os.environ.get('SEOUL_BUS_API_KEY','').strip())
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write('ready='+str(ready).lower()+'\n')
          if not ready:
              print('::notice title=Snapshot skipped::SEOUL_BUS_API_KEY not configured. No API calls were made; this is an expected, non-failing condition.')
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:
                  f.write('### Snapshot not attempted — missing credential\n\n')
                  f.write('- Status: **NOT_RUN_NO_CREDENTIALS**\n')
                  f.write('- API calls: **0**; vehicle observations: **0**\n')
                  f.write('- This is not evidence of missing bus service.\n')
                  f.write('- To collect real data, register repository Actions Secret SEOUL_BUS_API_KEY before manually dispatching this workflow.\n')
          else:
              print('::notice title=Snapshot configured::Credential available; attempting one-shot vehicle-position observations.')
          PY

      - uses: actions/checkout@v4
        if: steps.credentials.outputs.ready == 'true'
      - uses: actions/setup-python@v5
        if: steps.credentials.outputs.ready == 'true'
        with:
          python-version: '3.12'
      - name: Install collector dependency
        if: steps.credentials.outputs.ready == 'true'
        run: python -m pip install pandas==3.0.1 cryptography==46.0.4
      - name: Derive stable daily pseudonyms without persisting any secret
        if: steps.credentials.outputs.ready == 'true'
        env:
          SEOUL_BUS_API_KEY: ${{ secrets.SEOUL_BUS_API_KEY }}
        run: |
          python - <<'PY'
          import os,hmac,hashlib,urllib.parse
          service=urllib.parse.unquote(os.environ['SEOUL_BUS_API_KEY'].strip()).encode()
          salt=hmac.new(service,b'bus-pseudonymization-v2',hashlib.sha256).hexdigest()
          print('::add-mask::'+salt)
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('V4_VEHICLE_SALT='+salt+'\n')
          PY
      - name: Capture selected full-route or section snapshots
        if: steps.credentials.outputs.ready == 'true'
        env:
          SEOUL_BUS_API_KEY: ${{ secrets.SEOUL_BUS_API_KEY }}
          CAPTURE_SCOPE: ${{ inputs.scope || 'full' }}
          CAPTURE_COHORT: ${{ inputs.scope == 'section' && 'pilot3' || 'model15' }}
        run: |
          python medical/v4_vehicle_snapshot.py --cohort "$CAPTURE_COHORT" --scope "$CAPTURE_SCOPE" --capture --output "$RUNNER_TEMP/vehicle_observations.jsonl" > "$RUNNER_TEMP/capture_receipt.json"
          python medical/v4_capture_summary.py --receipt "$RUNNER_TEMP/capture_receipt.json" --private-jsonl "$RUNNER_TEMP/vehicle_observations.jsonl" --output "$RUNNER_TEMP/public/vehicle_capture_summary.json" --commit "$GITHUB_SHA"
          python medical/vehicle_evidence_storage.py seal --input "$RUNNER_TEMP/vehicle_observations.jsonl" --output "$RUNNER_TEMP/public/vehicle_details.enc"
      - name: Report provider availability without treating absent evidence as failure
        if: steps.credentials.outputs.ready == 'true'
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          receipt=json.loads((Path(os.environ['RUNNER_TEMP'])/'public/vehicle_capture_summary.json').read_text(encoding='utf-8'))
          requested=receipt['api_requests_executed']
          successful=receipt['successful_requests']
          snapshots=receipt['vehicle_snapshots']
          if successful == 0:
              status='PROVIDER_UNAVAILABLE_OR_REQUEST_ERROR'
              print('::warning title=No successful provider response::All provider requests failed; no actual service or boarding conclusion is possible.')
          elif snapshots == 0:
              status='PROVIDER_RESPONDED_NO_POSITION_SNAPSHOTS'
              print('::notice title=No position snapshots::Provider responded, but no vehicle snapshots were observed; not proof of absent service.')
          else:
              status='POSITION_SNAPSHOTS_ONLY'
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:
              f.write('### Vehicle-position API evidence status\n\n')
              f.write(f'- Status: **{status}**\n')
              f.write(f'- Query scope: **{receipt.get("query_scope")}**\n')
              f.write(f'- Attempted requests: **{requested}**; provider-successful: **{successful}**; snapshots: **{snapshots}**\n')
              f.write('- These snapshots do not confirm arrivals, boarding or actual low-floor vehicle headways.\n')
              f.write('- No private vehicle identifiers, pseudonyms or API secrets are published.\n')
          PY
      - name: Publish aggregate receipt only (no private vehicle identifiers)
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bus-vehicle-aggregate-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/public/vehicle_capture_summary.json
            ${{ runner.temp }}/public/vehicle_details.enc
          if-no-files-found: error
          retention-days: 30

  archive_public_aggregate:
    name: Commit pseudonym-free longitudinal observations
    needs: capture
    if: ${{ needs.capture.result == 'success' && needs.capture.outputs.ready == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: bus-vehicle-aggregate-${{ github.run_id }}
          path: "${{ runner.temp }}/aggregate"
      - name: Install encrypted evidence dependency
        run: python -m pip install cryptography==46.0.4
      - name: Save whitelisted route-level counts and update trend CSV
        env:
          SEOUL_BUS_API_KEY: ${{ secrets.SEOUL_BUS_API_KEY }}
        run: |
          python medical/archive_vehicle_aggregate.py \
            --input "$RUNNER_TEMP/aggregate/vehicle_capture_summary.json" \
            --output-dir observations/vehicle \
            --run-id "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" \
            --event "$GITHUB_EVENT_NAME"
          python medical/vehicle_evidence_storage.py archive \
            --input "$RUNNER_TEMP/aggregate/vehicle_details.enc" \
            --summary "$RUNNER_TEMP/aggregate/vehicle_capture_summary.json" \
            --directory observations/vehicle_encrypted \
            --run-id "$GITHUB_RUN_ID"
          git add observations/vehicle/ observations/vehicle_timeseries.csv \
            observations/vehicle_encrypted/ observations/vehicle_section_timeseries.csv \
            observations/vehicle_transitions.csv
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "observations: archive detailed encrypted snapshots for run $GITHUB_RUN_ID"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
