name: Medical offline reproducibility

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'medical/**'
      - 'README.md'
      - '.github/workflows/medical-reproduce.yml'
  push:
    branches: [main]
    paths:
      - 'medical/**'
      - 'README.md'
      - '.github/workflows/medical-reproduce.yml'

concurrency:
  group: medical-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Korean chart fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Run full analyses, regression tests and output hashes
        run: python medical/reproduce_all.py
      - name: Upload versioned reproducibility outputs
        uses: actions/upload-artifact@v4
        with:
          name: medical-validation-outputs
          path: |
            medical/results/cap_*.csv
            medical/results/cap_*.json
            medical/results/cap_*.png
            medical/results/cap5_*.csv
            medical/results/cap5_*.json
            medical/results/headway_*.csv
            medical/results/headway_*.json
            medical/results/feasibility_*.csv
            medical/results/feasibility_*.json
            medical/results/toy_*.csv
            medical/results/toy_*.json
            medical/results/route_case_brief.md
            medical/results/validation_v2_receipt.json
            medical/results/validation_v3_receipt.json
            medical/results/v3_*.csv
            medical/results/v3_*.json
            medical/results/v3_*.md
            medical/results/v4_*.csv
            medical/results/v4_*.json
            medical/results/v4_*.md
            medical/results/submission_v6/*.csv
            medical/results/submission_v6/*.json
            medical/results/submission_v6/*.md
            medical/results/validation_v4_receipt.json
          if-no-files-found: error

  publish_verified_results:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: reproduce
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: medical-validation-outputs
          path: medical/results
      - name: Commit only verified derived outputs to the repository
        run: |
          git add medical/results/cap_*.csv medical/results/cap_*.json medical/results/cap_*.png
          git add medical/results/cap5_*.csv medical/results/cap5_*.json
          git add medical/results/headway_*.csv medical/results/headway_*.json
          git add medical/results/feasibility_*.csv medical/results/feasibility_*.json
          git add medical/results/toy_*.csv medical/results/toy_*.json
          git add medical/results/route_case_brief.md medical/results/validation_v2_receipt.json
          git add medical/results/v3_*.csv medical/results/v3_*.json medical/results/v3_*.md
          git add medical/results/validation_v3_receipt.json
          git add medical/results/v4_*.csv medical/results/v4_*.json medical/results/v4_*.md
          git add medical/results/submission_v6/*.csv medical/results/submission_v6/*.json medical/results/submission_v6/*.md
          git add medical/results/validation_v4_receipt.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "results: publish reproducible medical validation outputs"
            git push
          fi
